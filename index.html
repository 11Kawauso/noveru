<!doctype html>
<html lang="ja" data-theme="cream">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noveru</title>
    <meta name="description" content="小説のような物語を、だれでも気軽に書いて、本棚に並べて見せられるサイト" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Noto+Serif+JP:wght@400;600&display=swap"
    />
    <script>
      // 色合いを先に決めておく（画面がちらつかないように）
      try {
        var t = localStorage.getItem("noveru-theme");
        if (t === "dark" || t === "cream") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <nav class="side-rail" id="side-rail" aria-label="メニュー"></nav>
    <div class="page-area">
      <div id="demo-banner" class="demo-banner" hidden>
        お試しモード：Firebase がまだ設定されていないため、データはこのブラウザの中だけに保存されます。
      </div>
      <main id="app"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
